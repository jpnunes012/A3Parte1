<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Divisor de Texto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f211d;
    --panel-a: #16332c;
    --panel-b: #1a2a3e;
    --accent: #e8a33d;
    --text: #ece7db;
    --text-dim: #93a89f;
    --line: rgba(236, 231, 219, 0.12);
    --error: #e2685a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "JetBrains Mono", monospace;
    min-height: 100vh;
    padding: 48px 24px 80px;
  }

  .wrap { max-width: 880px; margin: 0 auto; }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 36px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 24px;
  }

  h1 {
    font-family: "Fraunces", serif;
    font-weight: 500;
    font-size: 2.1rem;
    margin: 0;
    letter-spacing: -0.01em;
  }

  h1 span { color: var(--accent); }

  #status {
    font-size: 0.78rem;
    color: var(--text-dim);
    text-align: right;
    line-height: 1.5;
  }

  textarea {
    width: 100%;
    min-height: 120px;
    background: #0b1a16;
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    padding: 16px;
    resize: vertical;
  }

  textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  .actions {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 14px;
  }

  button {
    background: var(--accent);
    color: #1a1206;
    border: none;
    border-radius: 4px;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.85rem;
    padding: 12px 22px;
    cursor: pointer;
  }

  button:disabled { opacity: 0.5; cursor: default; }

  button:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #erro {
    color: var(--error);
    font-size: 0.85rem;
    display: none;
  }

  .split {
    margin-top: 40px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    position: relative;
    display: none;
  }

  .split.visivel { display: grid; }

  .split::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0; left: 50%;
    width: 2px;
    background: var(--accent);
    transform: scaleY(0);
    transform-origin: center;
    transition: transform 0.4s ease;
  }

  .split.aberto::before { transform: scaleY(1); }

  .painel { padding: 24px; }
  .painel.a { background: var(--panel-a); }
  .painel.b { background: var(--panel-b); }

  .painel .rotulo {
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  .painel .servidor-nome {
    font-family: "Fraunces", serif;
    font-size: 1.3rem;
    margin-bottom: 14px;
  }

  .painel .texto-parcial {
    font-size: 0.82rem;
    color: var(--text-dim);
    border-left: 2px solid var(--line);
    padding-left: 10px;
    margin-bottom: 18px;
    max-height: 96px;
    overflow-y: auto;
    line-height: 1.5;
    word-break: break-word;
  }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .stat .num {
    font-family: "Fraunces", serif;
    font-size: 1.6rem;
    line-height: 1;
  }

  .stat .lbl {
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-top: 4px;
  }

  .totais {
    margin-top: 0;
    padding: 24px;
    border-top: 1px solid var(--line);
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-around;
    text-align: center;
  }

  .totais .num { font-size: 2rem; }

  footer {
    margin-top: 20px;
    font-size: 0.75rem;
    color: var(--text-dim);
    display: none;
  }

  footer.visivel { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Text <span>Splitter</span></h1>
    <div id="status">verificando servidores…</div>
  </header>

  <textarea id="entrada" placeholder="Escreva ou cole um texto aqui para efetuar a divisão..."></textarea>
  <div class="actions">
    <button id="btn-enviar">Dividir</button>
    <span id="erro"></span>
  </div>

  <div class="split" id="split">
    <div class="painel a">
      <div class="rotulo">1º parte → localhost:8001</div>
      <div class="servidor-nome" id="nome1">—</div>
      <div class="texto-parcial" id="texto1"></div>
      <div class="stats" id="stats1"></div>
    </div>
    <div class="painel b">
      <div class="rotulo">2º parte → localhost:8002</div>
      <div class="servidor-nome" id="nome2">—</div>
      <div class="texto-parcial" id="texto2"></div>
      <div class="stats" id="stats2"></div>
    </div>
    <div class="totais" id="totais"></div>
  </div>

  <footer id="rodape"></footer>
</div>

<script>
const entrada = document.getElementById('entrada');
const btn = document.getElementById('btn-enviar');
const erro = document.getElementById('erro');
const split = document.getElementById('split');
const rodape = document.getElementById('rodape');
const statusEl = document.getElementById('status');

function statGrid(container, r) {
  container.innerHTML = '';
  [['palavras', r.palavras], ['vogais', r.vogais], ['letras', r.letras], ['numeros', r.numeros]]
    .forEach(([lbl, val]) => {
      const d = document.createElement('div');
      d.className = 'stat';
      d.innerHTML = `<div class="num">${val}</div><div class="lbl">${lbl}</div>`;
      container.appendChild(d);
    });
}

async function enviar() {
  const texto = entrada.value.trim();
  erro.style.display = 'none';
  if (!texto) {
    erro.textContent = 'escreve alguma coisa antes de mandar.';
    erro.style.display = 'inline';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'mandando…';
  split.classList.remove('aberto');

  try {
    const resp = await fetch('/api/processar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ texto })
    });

    if (!resp.ok) {
      const msg = await resp.text();
      throw new Error(msg || 'deu ruim ao processar');
    }

    const r = await resp.json();

    document.getElementById('nome1').textContent = r.resposta1.servidor || 'Servidor 1';
    document.getElementById('nome2').textContent = r.resposta2.servidor || 'Servidor 2';
    document.getElementById('texto1').textContent = r.parte1 || '(vazio)';
    document.getElementById('texto2').textContent = r.parte2 || '(vazio)';
    statGrid(document.getElementById('stats1'), r.resposta1);
    statGrid(document.getElementById('stats2'), r.resposta2);

    document.getElementById('totais').innerHTML =
      [['palavras', r.total.palavras], ['vogais', r.total.vogais], ['letras', r.total.letras], ['números', r.total.numeros]]
        .map(([lbl, val]) => `<div class="stat"><div class="num">${val}</div><div class="lbl">total de ${lbl}</div></div>`)
        .join('');

    split.classList.add('visivel');
    requestAnimationFrame(() => split.classList.add('aberto'));

    if (r.logArquivo) {
      rodape.textContent = `salvo em ${r.logArquivo}`;
      rodape.classList.add('visivel');
    }
  } catch (e) {
    erro.textContent = e.message;
    erro.style.display = 'inline';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Dividir';
  }
}

btn.addEventListener('click', enviar);
entrada.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) enviar();
});

statusEl.textContent = 'tudo pronto — esperando os servidores nas portas 8001 e 8002';
</script>
</body>
</html>
